name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'naas_app/**'
  pull_request:
    branches: [main]
    paths:
      - 'naas_app/**'

jobs:
  analyze:
    runs-on: ubuntu-latest
    name: Flutter Analyze

    defaults:
      run:
        working-directory: naas_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
